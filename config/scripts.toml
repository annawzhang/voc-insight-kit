# 销售话术：四步回应法（认同 → 重构 → 转移 → 落地），按车型策略差异化。
# 每条话术都会经过 forbidden 规则检查，命中即不能发布。

[models.A8]
strategy = "进攻型"
idea = "外观被市场验证过，不防守，转进攻"

[models.A9]
strategy = "坦诚型"
idea = "新车讨论分歧大，主动承认取舍，迅速转到价值与场景"

[models.M7]
strategy = "重构型"
idea = "承认轮廓相似，强调设计趋势、细节差异与家庭旗舰定位"

[[playbook]]
topic = "design"
concern = "被说「外观像某款车」"
model = "M7"
steps = [
  "确实不少人第一眼会这么觉得，您这个感受很正常。",
  "大家对比的主要是整体轮廓，低风阻 MPV 的大框架本来就会相似，前脸灯组和侧面线条差别其实不小。",
  "真正值这个价的是坐进去之后：第二排的空间和静谧性，图片里看不出来。",
  "要不要现在去第二排坐五分钟？坐完再判断值不值。",
]

[[playbook]]
topic = "design"
concern = "觉得溜背不适合三排家用"
model = "A9"
steps = [
  "这个担心很实在，三排家用最怕后排憋屈。",
  "溜背主要影响的是第三排头部空间，我们把座椅坐姿和车顶内衬都做了针对性调整。",
  "比起外观，家里老人孩子每天坐得舒不舒服更重要，这个可以直接实测。",
  "我帮您把第三排调到常用位置，您带家人一起坐一下。",
]

[[playbook]]
topic = "design"
concern = "觉得外观普通、不够新"
model = "A8"
steps = [
  "能理解，现在新车外观一个比一个激进。",
  "这套家族设计已经被几万个家庭选过，耐看、不过时，三五年后再看也不会尴尬。",
  "外观是看一眼的事，空间和智能是每天都在用的。",
  "今天先试驾一圈，看看是不是越开越顺眼。",
]

[[playbook]]
topic = "price"
concern = "嫌 A9 定价超过心理价位"
model = "A9"
steps = [
  "四十万左右确实是很多家庭会认真掂量的价位，您谨慎是对的。",
  "我们把配置拆开看：芯片、电池和底盘这几项，单独加装都不便宜。",
  "更关键的是用车成本，按每年两万公里算，能省下的费用可以给您算一笔账。",
  "我把入门版和您关心的配置列一张对比表，您回去和家人一起看。",
]

[[playbook]]
topic = "overlap"
concern = "觉得 A9 和 A8、M7 重叠，没必要"
model = "A9"
steps = [
  "这个问题问得好，很多客户也在三款之间犹豫。",
  "三款解决的是不同场景：A8 偏城市家用，M7 偏商务和长途，A9 是想要 SUV 通过性又要大空间的家庭。",
  "与其看参数，不如看您家平时怎么用车：几个人、跑多远、去不去郊外。",
  "您说说日常用车场景，我帮您直接排除不合适的那款。",
]

[[playbook]]
topic = "trust"
concern = "担心买了就降价"
model = "A8"
steps = [
  "您有这个顾虑很正常，之前确实有车主反映过。",
  "价格调整我们没法替厂家保证，但能说清楚的是现在的权益和置换政策。",
  "买车更该看的是这台车能陪您用多少年、每年省多少，而不是某一天的价格。",
  "我把当前权益和有效期写下来给您，您对比后再决定。",
]

[[playbook]]
topic = "intent"
concern = "想等改款或等新车再买"
model = "A8"
steps = [
  "想等等再决定很合理，买车本来就不该着急。",
  "外观迭代周期通常是三到五年，而用车带来的便利是每天都有的。",
  "您可以先体验现款，心里有个基准，新车出来时也更好比较。",
  "先约个周末试驾，不影响您后面怎么选。",
]

# 禁止话术：命中任何一条，话术不得发布
[[forbidden]]
pattern = "(就是|绝对)原创|没抄"
reason = "硬刚原创争议会激化争论"

[[forbidden]]
pattern = "黑子|水军|喷子"
reason = "否定用户判断，信任下降"

[[forbidden]]
pattern = "以后(肯定|一定)涨价|(肯定|绝对)不会(再)?降"
reason = "价格承诺敏感，容易被截图形成背刺舆情"

[[forbidden]]
pattern = "(某|竞品|别家).{0,4}(垃圾|不行|差劲)"
reason = "贬低竞品，容易引发骂战"

[[forbidden]]
pattern = "最后[一1]台|今天不订就没了"
reason = "虚假紧迫感，违反销售规范"

# 一线销售提交的草稿（虚构），用于演示检查效果
