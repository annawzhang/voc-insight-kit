# 议题编码本：一条评论可命中多个议题。关键词命中即编码，排除词用于消歧。
# 车型均为虚构：A9（待上市大型 SUV）、A8（在售 SUV）、M7（在售 MPV 旗舰）。

target = "A9"
siblings = ["A8", "M7"]

[[topics]]
key = "price"
name = "定价"
question = "A9 定价多少合适？有没有心理关口？"
keywords = ["万", "价格", "定价", "贵", "便宜", "起售", "售价", "价位"]

[[topics]]
key = "overlap"
name = "定位重叠"
question = "A9 与 A8、M7 是否定位重叠？"
keywords = ["A8", "M7", "重叠", "多余", "没必要", "定位", "内耗"]

[[topics]]
key = "design"
name = "造型"
question = "溜背造型能否被大型 SUV 用户接受？"
keywords = ["溜背", "造型", "外观", "好看", "丑", "设计", "像", "颜值", "颜色", "方正"]
exclude = ["像素"]

[[topics]]
key = "sales"
name = "销量预期"
question = "上市后销量预期如何？"
keywords = ["销量", "卖不动", "扑", "爆款", "零头", "能卖"]

[[topics]]
key = "spec"
name = "配置期待"
question = "哪些配置能把讨论转向正面？"
keywords = ["芯片", "电池", "续航", "底盘", "屏", "算力", "配置", "智驾"]

[[topics]]
key = "intent"
name = "决策状态"
question = "潜在用户现在处于什么决策状态？"
keywords = ["等 A9", "等A9", "等试驾", "观望", "试驾", "订了", "提了", "锁单", "置换", "不考虑", "放弃"]

[[topics]]
key = "trust"
name = "价格信任"
question = "老车主是否担心降价背刺？"
keywords = ["背刺", "降价", "老车主", "保值", "首发"]

[stance]
positive = ["期待", "好看", "喜欢", "不会差", "搞快点", "天花板", "值", "香", "支持", "爱了"]
negative = ["扑", "贵", "丑", "多余", "没必要", "卖不动", "失望", "劝退", "背刺", "不买", "放弃", "零头", "别费事"]
# 否定词出现在情感词前 2 个字内时翻转极性
negations = ["不", "没", "别"]

[personas]
# 按顺序匹配，先命中先归类
waiting = { name = "等待派", keywords = ["等", "搞快点", "什么时候", "期待"] }
locked = { name = "已选其他派", keywords = ["订了", "提了", "锁单", "已经买"] }
quit = { name = "放弃派", keywords = ["不考虑", "放弃"] }
watch = { name = "观望派", keywords = ["观望", "看看", "再说", "试驾"] }
